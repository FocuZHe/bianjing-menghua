<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>汴京梦华图 · 水墨三维长卷</title>
<meta name="description" content="用 three.js 重建《清明上河图》的三维长卷：汴河、虹桥、城门、街市、田畴，约 430 个人物，全部由一套自定义水墨后期管线画出来。" />
<meta property="og:title" content="汴京梦华图 · 水墨三维长卷" />
<meta property="og:description" content="拟张择端笔意的三维汴河长卷：拖拽展卷，空格自动游览。" />
<meta property="og:type" content="website" />
<style>:root {
  --paper: #ece2cc;
  --paper-deep: #ddd0b2;
  --ink: #2b2a26;
  --ink-soft: #5b574c;
  --cinnabar: #9e3b2c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #ece2cc;
  font-family: "Songti SC", "STSong", "SimSun", "Noto Serif CJK SC", serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

#app { position: fixed; inset: 0; }

#scene {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  cursor: grab;
}
#scene.dragging { cursor: grabbing; }

/* 纸纹叠加：让渲染结果"落在纸上" */
#paper-grain {
  position: absolute; inset: 0;
  pointer-events: none;
  mix-blend-mode: multiply;
  opacity: 0.30;
  background-image:
    repeating-linear-gradient(0deg, rgba(120,105,80,0.045) 0px, rgba(120,105,80,0.045) 1px, transparent 1px, transparent 3px),
    repeating-linear-gradient(90deg, rgba(150,135,105,0.03) 0px, rgba(150,135,105,0.03) 1px, transparent 1px, transparent 4px);
}

/* 四周压暗，形成卷轴观感 */
#vignette {
  position: absolute; inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 78% 68% at 50% 48%, rgba(236,226,204,0) 42%, rgba(214,199,168,0.16) 74%, rgba(190,172,138,0.34) 100%),
    linear-gradient(to right, rgba(120,100,70,0.16), rgba(120,100,70,0) 7%, rgba(120,100,70,0) 93%, rgba(120,100,70,0.16));
}

/* ---------- 题签 ---------- */
#title-card {
  position: absolute;
  top: 6.5vh;
  left: 4.2vw;
  pointer-events: none;
  opacity: 0;
  animation: fadeUp 2.2s ease-out 0.6s forwards;
  writing-mode: vertical-rl;
  text-orientation: upright;
}
#title-card .t-main {
  font-size: clamp(30px, 4.4vw, 62px);
  letter-spacing: 0.16em;
  font-weight: 600;
  color: #26251f;
  text-shadow: 0 1px 0 rgba(255,255,255,0.35);
}
#title-card .t-sub {
  margin-top: 0.5em;
  font-size: clamp(11px, 1.05vw, 15px);
  letter-spacing: 0.42em;
  color: #6b6353;
}
#title-card .t-line {
  width: 1px; height: 7vh;
  margin: 1.1em auto 0.9em;
  background: linear-gradient(to bottom, rgba(90,80,60,0.55), rgba(90,80,60,0));
}
#title-card .t-note {
  font-size: clamp(10px, 0.9vw, 13px);
  letter-spacing: 0.3em;
  color: #7d7461;
}

/* ---------- HUD ---------- */
#hud {
  position: absolute;
  right: 3.2vw;
  bottom: 4.2vh;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 9px;
  pointer-events: none;
  opacity: 0;
  animation: fadeUp 1.8s ease-out 1.4s forwards;
}
.hud-row { display: flex; align-items: baseline; gap: 8px; }
.hud-k {
  font-size: 10px; letter-spacing: 0.3em;
  color: #8a8069;
}
.hud-v {
  font-size: clamp(15px, 1.5vw, 20px);
  letter-spacing: 0.24em;
  color: #33322b;
  min-width: 5em;
  text-align: right;
  transition: opacity 0.4s;
}
.hud-bar {
  width: clamp(120px, 15vw, 210px);
  height: 1px;
  background: rgba(90,80,60,0.22);
  position: relative;
}
#hud-progress {
  position: absolute; left: 0; top: 0; height: 100%;
  width: 0%;
  background: var(--cinnabar);
  opacity: 0.75;
  transition: width 0.25s linear;
}
.hud-small {
  font-size: 10.5px;
  letter-spacing: 0.18em;
  color: #8d8471;
  opacity: 0.85;
}

/* ---------- 动态 / 静态 切换 ---------- */
#hud-anim { pointer-events: auto; margin-top: 2px; align-items: center; gap: 10px; }
#anim-toggle {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px 4px 9px;
  font: inherit;
  font-size: 11.5px;
  letter-spacing: 0.22em;
  color: #4a4438;
  background: rgba(236, 226, 204, 0.0);
  border: 1px solid rgba(90, 80, 60, 0.32);
  border-radius: 2px;
  cursor: pointer;
  transition: background 0.25s, border-color 0.25s, color 0.25s;
  -webkit-appearance: none;
  appearance: none;
}
#anim-toggle:hover { background: rgba(90, 80, 60, 0.07); border-color: rgba(90, 80, 60, 0.5); }
#anim-toggle:active { background: rgba(90, 80, 60, 0.13); }
#anim-toggle .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cinnabar);
  opacity: 0.9;
  transition: opacity 0.25s, transform 0.25s;
}
#anim-toggle[aria-pressed="false"] { color: #8d8471; border-color: rgba(90, 80, 60, 0.2); }
#anim-toggle[aria-pressed="false"] .dot { opacity: 0.28; transform: scale(0.72); }
.hud-anim-hint { pointer-events: none; opacity: 0.6; }

/* ---------- 载入 ---------- */
#loading {
  position: absolute; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  background: var(--paper);
  transition: opacity 1.1s ease;
  z-index: 20;
}
#loading.done { opacity: 0; pointer-events: none; }
.ld-ink {
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1.4px solid rgba(70,62,48,0.28);
  border-top-color: rgba(70,62,48,0.85);
  animation: spin 1.1s linear infinite;
}
.ld-text {
  font-size: 13px;
  letter-spacing: 0.55em;
  color: #6d6455;
  text-indent: 0.55em;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 720px) {
  #title-card { top: 4.5vh; left: 5vw; }
  #hud { right: 5vw; bottom: 3.2vh; }
  .hud-small { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="paper-grain"></div>
  <div id="vignette"></div>

  <div id="title-card">
    <div class="t-main">汴京梦华图</div>
    <div class="t-sub">拟 张 择 端 笔 意</div>
    <div class="t-line"></div>
    <div class="t-note">水墨三维长卷 · 汴河两岸</div>
  </div>

  <div id="hud">
    <div class="hud-row" id="hud-loc"><span class="hud-k">卷</span><span class="hud-v" id="loc-name">郊野</span></div>
    <div class="hud-bar"><div id="hud-progress"></div></div>
    <div class="hud-row hud-small" id="hud-hint">拖拽旋转 · 滚轮远近 · <b>WASD</b> 平移 · <b>QE</b> 升降 · <b>Shift</b> 加速 · <span id="tour-state">空格自动游览</span></div>
    <div class="hud-row" id="hud-anim">
      <button id="anim-toggle" type="button" aria-pressed="false"><span class="dot"></span><span id="anim-label">静态</span></button>
      <span class="hud-small hud-anim-hint" id="anim-hint">M 键开启动态</span>
    </div>
  </div>

  <div id="loading">
    <div class="ld-ink"></div>
    <div class="ld-text">研 墨 中</div>
  </div>
</div>

uniform float uMistNear;   // \u96FE\u972D\u5F00\u59CB\u7684\u8DDD\u79BB
uniform float uMistFar;    // \u96FE\u972D\u6700\u6D53\u7684\u8DDD\u79BB

float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

vec3 toSRGB(vec3 c){
  c = max(c, vec3(0.0));
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0/2.4)) - 0.055, step(0.0031308, c));
}

float linearDepth(float d){
  float z = d * 2.0 - 1.0;
  return (2.0 * uNear * uFar) / (uFar + uNear - z * (uFar - uNear));
}

vec3 worldPos(vec2 uv, float d){
  vec4 ndc = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0);
  vec4 wp = uInvProjView * ndc;
  return wp.xyz / wp.w;
}

// \u8FDC\u666F\u865A\u7126\uFF1A\u6309\u7EBF\u6027\u6DF1\u5EA6\u9010\u7EA7\u653E\u5927\u91C7\u6837\u6838\u3002
// \u8FD9\u662F"\u5C71\u4F53\u6E10\u6E10\u6A21\u7CCA"\u7684\u5B9E\u73B0 \u2014\u2014 \u4E0D\u662F\u7B80\u5355\u892A\u6210\u7EB8\u8272\uFF08\u90A3\u6837\u53EA\u662F\u53D8\u6DE1\uFF0C\u8FB9\u7F18\u8FD8\u662F\u9510\u7684\uFF09\uFF0C
// \u800C\u662F\u771F\u7684\u628A\u8FDC\u5904\u7684\u9AD8\u9891\u7EC6\u8282\u62B9\u6389\uFF0C\u4E8E\u662F\u8FDC\u5C71\u53EA\u5269\u56E2\u5757\u4E0E\u810A\u7EBF\u7684\u4F59\u97F5\u3002
vec3 blurredColor(vec2 uv, float radius){
  if (radius < 0.35) return toSRGB(texture2D(tColor, uv).rgb);
  vec2 t = (1.0 / uResolution) * radius;
  // 12 \u70B9\u9EC4\u91D1\u89D2\u87BA\u65CB\uFF0C\u6BD4 3x3 \u66F4\u50CF"\u6563\u7126"\uFF0C\u4E5F\u6CA1\u6709\u660E\u663E\u7684\u5341\u5B57\u7EB9
  vec3 acc = toSRGB(texture2D(tColor, uv).rgb);
  float wsum = 1.0;
  for (int i = 0; i < 12; i++){
    float fi = float(i);
    float a = fi * 2.39996323;
    float r = sqrt((fi + 0.5) / 12.0);
    float w = 1.0 - r * 0.55;
    acc += toSRGB(texture2D(tColor, uv + vec2(cos(a), sin(a)) * r * t).rgb) * w;
    wsum += w;
  }
  return acc / wsum;
}

void main(){
  vec2 uv = vUv;
  vec2 texel = 1.0 / uResolution;

  // ===== 1) \u53D6\u8272\u5E76\u8F6C sRGB =====
  float depth = texture2D(tDepth, uv).r;
  float linZ = linearDepth(depth);
  bool isSky = depth >= 0.9999;

  // \u8FDC\u666F\u865A\u7126\u534A\u5F84\uFF1A0\uFF08\u8FD1\uFF09\u2192 uBlurMax\uFF08\u8FDC\uFF09
  float blurT = smoothstep(uBlurNear, uBlurFar, linZ);
  float blurR = blurT * uBlurMax;
  vec3 color = blurredColor(uv, blurR);

  vec3 wp = worldPos(uv, depth);
  vec3 nView = texture2D(tNormal, uv).xyz * 2.0 - 1.0;
  vec3 nWorld = normalize(uCamWorldRot * nView);

  // \u4E16\u754C\u7A7A\u95F4\u58A8\u97F5\u566A\u58F0\u3002
  // \u6CE8\u610F\uFF1A\u53EA\u7528 wp.xz \u91C7\u6837\u4F1A\u5728\u5782\u76F4\u9762\uFF08\u5C71\u4F53\uFF09\u4E0A\u62C9\u51FA\u7AD6\u6761\uFF0C
  // \u6240\u4EE5\u6309\u6CD5\u7EBF\u505A\u4E09\u5E73\u9762\u6DF7\u5408\u3002
  vec3 an = abs(nWorld);
  an = an / max(an.x + an.y + an.z, 1e-4);
  float wn1 =
      texture2D(tNoise, wp.xz * 0.0075).r * an.y
    + texture2D(tNoise, wp.zy * 0.0075).r * an.x
    + texture2D(tNoise, wp.xy * 0.0075).r * an.z;
  float wn2 =
      texture2D(tNoise, wp.xz * 0.021 - 0.31).r * an.y
    + texture2D(tNoise, wp.zy * 0.021 - 0.31).r * an.x
    + texture2D(tNoise, wp.xy * 0.021 - 0.31).r * an.z;
  float washN = wn1 * 0.62 + wn2 * 0.38;

  // ============================================================
  // 2) \u58A8\u7EBF\u63D0\u53D6
  // ============================================================
  float w = uEdgeWidth;
  vec2 o = texel * w;

  float d0 = linZ;
  float d1 = linearDepth(texture2D(tDepth, uv + vec2( o.x,  o.y)).r);
  float d2 = linearDepth(texture2D(tDepth, uv + vec2(-o.x,  o.y)).r);
  float d3 = linearDepth(texture2D(tDepth, uv + vec2( o.x, -o.y)).r);
  float d4 = linearDepth(texture2D(tDepth, uv + vec2(-o.x, -o.y)).r);

  float gx = (d1 + d3) - (d2 + d4);
  float gy = (d1 + d2) - (d3 + d4);
  float depthEdge = sqrt(gx * gx + gy * gy) / max(d0, 0.001);

  vec3 nC = nView;
  float normalEdge = 0.0;
  {
    vec3 a = texture2D(tNormal, uv + vec2( o.x, 0.0)).xyz * 2.0 - 1.0;
    vec3 b = texture2D(tNormal, uv + vec2(-o.x, 0.0)).xyz * 2.0 - 1.0;
    vec3 c = texture2D(tNormal, uv + vec2(0.0,  o.y)).xyz * 2.0 - 1.0;
    vec3 e = texture2D(tNormal, uv + vec2(0.0, -o.y)).xyz * 2.0 - 1.0;
    normalEdge = (length(a - nC) + length(b - nC) + length(c - nC) + length(e - nC)) * 0.25;
  }

  float lC = luma(color);
  float lumEdge =
    abs(luma(toSRGB(texture2D(tColor, uv + vec2( o.x, 0.0)).rgb)) - lC) +
    abs(luma(toSRGB(texture2D(tColor, uv + vec2(-o.x, 0.0)).rgb)) - lC) +
    abs(luma(toSRGB(texture2D(tColor, uv + vec2(0.0,  o.y)).rgb)) - lC) +
    abs(luma(toSRGB(texture2D(tColor, uv + vec2(0.0, -o.y)).rgb)) - lC);

  float edge = depthEdge * 1.0 + normalEdge * 0.5 + lumEdge * 0.30;

  // \u7A7A\u6C14\u900F\u89C6\uFF1A\u8FDC\u5904\u7684\u7EBF\u53D8\u6DE1
  float aerialLine = 1.0 - smoothstep(uFadeNear * 0.45, uFadeFar * 0.90, linZ);
  edge *= mix(0.20, 1.0, aerialLine);

  // ---- \u6BDB\u7B14\u63D0\u6309 ----
  float brushN = texture2D(tNoise, uv * 2.7 + vec2(uTime * 0.004, 0.0)).r;
  float brushN2 = texture2D(tNoise, uv * 9.0 - vec2(0.0, uTime * 0.003)).r;
  float press = 0.50 + brushN * 0.80 + brushN2 * 0.28;

  // \u7C97\u7EBF\u5C42\uFF1A\u8FDC\u770B\u6709\u7B14\u610F
  float eWide = 0.0;
  for (int i = 0; i < 4; i++) {
    float a = float(i) * 1.5707963;
    vec2 dir = vec2(cos(a), sin(a)) * texel * w * 2.6;
    float dd = linearDepth(texture2D(tDepth, uv + dir).r);
    eWide += abs(dd - d0) / max(d0, 0.001);
  }
  eWide = smoothstep(0.018, 0.20, eWide * 0.25) * 0.50;

  edge = max(edge, eWide) * press;
  edge = smoothstep(0.028, 0.28, edge);

  // ---- \u98DE\u767D\uFF1A\u5E72\u7B14\u5904\u65AD\u5F00 ----
  float dry = texture2D(tNoise, uv * 34.0 + vec2(uTime * 0.02, 0.0)).r;
  edge *= mix(0.50, 1.0, smoothstep(0.26, 0.60, dry));

  // ---- \u79EF\u58A8\uFF1A\u7EBF\u5468\u56F4\u6655\u5F00\u7684\u6C34\u75D5 ----
  float bleed = 0.0;
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.7853982;
    vec2 dir = vec2(cos(a), sin(a)) * texel * w * 3.4;
    float dd = linearDepth(texture2D(tDepth, uv + dir).r);
    bleed += smoothstep(0.014, 0.15, abs(dd - d0) / max(d0, 0.001));
  }
  bleed = (bleed / 8.0) * 0.28 * (0.55 + brushN * 0.9);

  // ---- \u7EBF\u5BC6\u5EA6\u81EA\u9002\u5E94\uFF08\u5173\u952E\uFF09----
  // \u628A\u955C\u5934\u62C9\u8FDC\u65F6\uFF0C\u51E0\u767E\u680B\u623F\u5B50/\u4E0A\u5343\u4E2A\u4EBA\u6324\u8FDB\u51E0\u5341\u4E2A\u50CF\u7D20\uFF0C\u6BCF\u4E00\u4E2A\u50CF\u7D20\u90FD\u5224\u5B9A\u6210
  // "\u8FB9\u7F18"\uFF0C\u4E8E\u662F edge \u548C bleed \u540C\u65F6\u9971\u548C \u2192 \u6574\u7247\u5EFA\u7B51\u7CCA\u6210\u4E00\u5768\u9ED1\uFF0C\u8FD8\u4F1A\u51FA\u73B0
  // \u62C7\u6307\u7C97\u7684\u9ED1\u6761\u3002\u8FD9\u91CC\u7EDF\u8BA1 8 \u90BB\u57DF\u91CC\u6709\u591A\u5C11\u4E2A\u50CF\u7D20\u4E5F\u662F\u8FB9\u7F18\uFF1A
  //   \xB7 \u5B64\u7ACB\u7684\u4E00\u6839\u7EBF \u2192 dens \u5F88\u4F4E\uFF0C\u539F\u6837\u4FDD\u7559
  //   \xB7 \u4E00\u6574\u7247\u5BC6\u6797/\u5C4B\u7FA4 \u2192 dens \u5F88\u9AD8\uFF0C\u4E3B\u52A8\u51CF\u58A8\uFF0C\u53EA\u7559\u8F6E\u5ED3\u4E0D\u7CCA\u6210\u5757
  float dens = 0.0;
  for (int i = 0; i < 8; i++) {
    float a = float(i) * 0.7853982;
    vec2 dir = vec2(cos(a), sin(a)) * texel * (w * 2.1);
    float dd = linearDepth(texture2D(tDepth, uv + dir).r);
    dens += smoothstep(0.010, 0.11, abs(dd - d0) / max(d0, 0.001));
  }
  dens = dens / 8.0;
  float crowded = smoothstep(0.34, 0.92, dens);

  edge = clamp(edge * uEdgeStrength, 0.0, 1.0);
  bleed = clamp(bleed * uEdgeStrength, 0.0, 1.0);

  // \u62E5\u6324\u533A\u4E3B\u52A8\u51CF\u58A8\uFF1A\u7EBF\u53EA\u7559 34%\uFF0C\u79EF\u6C34\u51E0\u4E4E\u5168\u538B\u6389\u3002
  // \u8FD9\u662F"\u8FDC\u770B\u662F\u4E00\u7247\u6DE1\u58A8\u5EFA\u7B51\u7FA4\uFF0C\u800C\u4E0D\u662F\u4E00\u56E2\u9ED1"\u7684\u552F\u4E00\u53EF\u9760\u529E\u6CD5\u3002
  edge *= 1.0 - crowded * 0.66;
  bleed *= 1.0 - crowded * 0.88;

  // ============================================================
  // 3) \u76B4\u6CD5\uFF1A\u5761\u9762\u4E0A\u7684\u62C9\u957F\u7B14\u89E6\uFF08\u62AB\u9EBB\u76B4\uFF09
  // ============================================================
  float slope = 1.0 - clamp(abs(nWorld.y), 0.0, 1.0);   // 0=\u6C34\u5E73\u9762 1=\u5782\u76F4\u9762
  float cunMask = 0.0;
  if (!isSky && slope > 0.02) {
    // \u4E0B\u5761\u65B9\u5411\uFF08\u6C34\u5E73\u6295\u5F71\uFF09
    vec3 downDir = vec3(nWorld.x, 0.0, nWorld.z);
    float dl = length(downDir);
    downDir = dl > 1e-4 ? downDir / dl : vec3(1.0, 0.0, 0.0);
    vec3 perp = normalize(cross(vec3(0.0, 1.0, 0.0), downDir));

    float t = dot(wp, downDir);
    float s = dot(wp, perp);

    // \u6CBF\u4E0B\u5761\u65B9\u5411\u62C9\u957F\u7684\u566A\u58F0 -> \u9EBB\u7EF3\u72B6\u7B14\u89E6
    // \u4E09\u5C42\u4E0D\u540C\u9891\u7387\u53E0\u52A0\uFF0C\u907F\u514D\u7B49\u8DDD\u6761\u7EB9
    float c1 = texture2D(tNoise, vec2(s * 0.085, t * 0.011)).r;
    float c2 = texture2D(tNoise, vec2(s * 0.21 + 0.4, t * 0.030)).r;
    float c3 = texture2D(tNoise, vec2(s * 0.47 - 0.7, t * 0.062)).r;
    float cun = c1 * 0.50 + c2 * 0.32 + c3 * 0.18;

    // \u7528\u4F4E\u9891\u566A\u58F0\u505A"\u65AD\u7B14"\uFF1A\u6709\u7684\u5730\u65B9\u6839\u672C\u6CA1\u76B4\u5230
    float gap = texture2D(tNoise, vec2(s * 0.031 + 0.13, t * 0.0045)).r;
    cun *= smoothstep(0.30, 0.52, gap) * 1.35;

    cun = smoothstep(0.44, 0.66, cun);
    // \u7B14\u89E6\u968F\u9AD8\u5EA6\u8870\u51CF\uFF08\u5C71\u9876\u6DE1\uFF09
    float hFade = 1.0 - smoothstep(20.0, 70.0, wp.y);
    // \u8D8A\u9661\u8D8A\u660E\u663E
    cunMask = cun * smoothstep(0.06, 0.55, slope) * hFade * uCun;
  }

  // ============================================================
  // 4) \u70B9\u82D4\uFF1A\u77F3\u4E0A\u82D4\u70B9
  // ============================================================
  float mossMask = 0.0;
  if (!isSky) {
    float m1 = texture2D(tNoise, wp.xz * 0.42 + wp.y * 0.3).r * an.y
             + texture2D(tNoise, wp.zy * 0.42).r * an.x
             + texture2D(tNoise, wp.xy * 0.42).r * an.z;
    m1 = smoothstep(0.78, 0.90, m1);
    mossMask = m1 * smoothstep(0.05, 0.35, slope) * uMoss;
  }

  // ============================================================
  // 5) \u58A8\u5206\u4E94\u8272
  // ============================================================
  float lum = luma(color);
  lum = pow(lum, 0.86);
  lum *= 0.90 + washN * 0.22;

  float steps = max(uToneSteps, 2.0);
  float jitter = (washN - 0.5) * 0.60;
  float stepped = floor(lum * steps + 0.5 + jitter) / steps;
  stepped = mix(lum, stepped, uToneMix);

  vec3 toned = color * (stepped / max(lum, 0.0015));
  toned = mix(toned, uInkColor, uWash * (1.0 - stepped) * 0.40);

  // \u76B4\u4E0E\u82D4
  toned = mix(toned, uInkColor, cunMask * 0.30);
  toned = mix(toned, uInkColor, mossMask * 0.55);

  // ============================================================
  // 6) \u7559\u767D
  // ============================================================
  float hold = smoothstep(0.72, 0.98, stepped) * uPaperHold;
  toned = mix(toned, uPaperColor, hold);

  // ============================================================
  // 7) \u5927\u6C14\u9000\u6655
  // ============================================================
  float fade = smoothstep(uFadeNear, uFadeFar, linZ);
  fade = pow(fade, 1.15);
  toned = mix(toned, uPaperColor, fade);

  // ---- \u8D34\u5730\u96FE\u972D ----
  // \u5B8B\u753B\u7684"\u8FDC"\u4E0D\u662F\u6162\u6162\u53D8\u6DE1\uFF0C\u800C\u662F\u88AB\u4E00\u5C42\u8D34\u5730\u7684\u4E91\u6C14\u5403\u6389\u4E0B\u534A\u622A\uFF0C
  // \u53EA\u5269\u5C71\u810A\u6D6E\u5728\u96FE\u4E0A\uFF08\u7C73\u6C0F\u4E91\u5C71\u5C31\u662F\u8FD9\u4E48\u753B\u7684\uFF09\u3002
  // \u8FD9\u91CC\u6309\u4E16\u754C\u9AD8\u5EA6 + \u8DDD\u79BB\u5171\u540C\u51B3\u5B9A\u96FE\u91CF\uFF1A\u8D8A\u4F4E\u8D8A\u8FDC\uFF0C\u8D8A\u5316\u8FDB\u7EB8\u91CC\u3002
  // \u987A\u5E26\u89E3\u51B3\u4E86"\u5730\u5F62\u5C3D\u5934\u662F\u4E00\u6761\u6A2A\u8D2F\u786C\u7EBF"\u7684\u8001\u95EE\u9898 \u2014\u2014 \u90A3\u4E00\u6761\u6B63\u597D\u88AB\u96FE\u76D6\u6389\u3002
  float mistH = exp(-max(wp.y, 0.0) / uMistHeight);   // \u6C34\u9762 y=0
  float mistD = smoothstep(uMistNear, uMistFar, linZ);
  float mist = mistH * mistD * uMist;
  // \u53EA\u5BF9"\u4E0D\u662F\u5929"\u7684\u50CF\u7D20\u52A0\u96FE\uFF0C\u5426\u5219\u5929\u7A7A\u4F1A\u88AB\u538B\u6697
  mist *= isSky ? 0.0 : 1.0;
  toned = mix(toned, uPaperColor, clamp(mist, 0.0, 1.0));

  // ============================================================
  // 8) \u53E0\u58A8\u7EBF
  // ============================================================
  // \u58A8\u7EBF\u4E5F\u5FC5\u987B\u8DDF\u7740\u8DDD\u79BB\u865A\u5316\u3002\u539F\u6765\u53EA\u9760 uFadeNear*0.75 ~ uFadeFar \u8FD9\u6761\u5F88\u5BBD\u7684\u66F2\u7EBF\uFF0C
  // z=300 \u7684\u5C71\u810A\u7EBF\u51E0\u4E4E\u4E00\u70B9\u6CA1\u6DE1 \u2014\u2014 \u4E8E\u662F"\u5C71\u4F53\u6A21\u7CCA\u4E86\u3001\u8F6E\u5ED3\u8FD8\u662F\u5200\u5207\u7684"\u3002
  // \u73B0\u5728\u8BA9\u58A8\u7EBF\u7684\u8870\u51CF\u8DDF\u865A\u7126\u66F2\u7EBF\u540C\u6B65\uFF1A\u8D70\u5230 uBlurNear \u5F00\u59CB\u6389\uFF0C\u5230 uBlurFar \u5C31\u6CA1\u4E86\u3002
  float lineFade = 1.0 - smoothstep(uBlurNear * 0.45, uBlurFar * 0.92, linZ);
  lineFade *= 1.0 - smoothstep(uFadeNear * 1.2, uFadeFar * 1.0, linZ) * 0.7;
  vec3 lineColor = mix(uInkColor, vec3(0.14, 0.13, 0.11), 0.55);
  toned = mix(toned, lineColor, bleed * lineFade * 0.32);
  toned = mix(toned, lineColor, edge * lineFade * 0.92);

  // ============================================================
  // 9) \u7EB8\u7EB9 + \u6697\u89D2
  // ============================================================
  vec2 puv = uv * vec2(uResolution.x / max(uResolution.y, 1.0), 1.0) * 1.4;
  float paperN = texture2D(tPaper, puv).r;
  float paperN2 = texture2D(tPaper, puv * 3.3 + 0.21).r;
  float grain = paperN * 0.62 + paperN2 * 0.38;
  // \u7EB8\u7EB9\u53EA\u80FD"\u538B\u6697"\uFF0C\u4E0D\u80FD"\u63D0\u4EAE"\u3002
  // \u539F\u6765\u8FD9\u91CC\u662F 0.925 + grain*0.15\uFF08\u8303\u56F4 0.925~1.075\uFF09\uFF0C\u4E8E\u662F\u4EFB\u4F55\u672C\u6765\u5C31\u63A5\u8FD1
  // \u7EB8\u8272\u7684\u533A\u57DF\uFF08\u8FDC\u5C71\u3001\u96FE\uFF09\u4F1A\u88AB\u7EB8\u7EB9\u63D0\u4EAE\u5230**\u6BD4\u5929\u7A7A\u8FD8\u4EAE** \u2014\u2014 \u5929\u7A7A\u662F\u5728\u8FD9\u4E4B\u540E
